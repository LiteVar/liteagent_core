name: liteagent_core_dart
description: LLM AI Agent sessions service in Dart.
version: 1.0.0
repository: https://github.com/LiteVar/lite_agent_core_dart

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  unique_id_dart: ^1.0.0
  json_annotation: ^4.9.0
  http: ^1.4.0
  token_pack: ^0.1.0
  front_matter_ml: ^1.2.0

  # OpenAI style api support
  dart_openai_sdk: ^6.1.3
  llamadart_openai:
    path: ../llamadart_openai
  lite_oneapi: ^0.2.0

  # OpenSpec support
  opentool_dart: ^2.0.1
  opentool_daemon: ^0.2.1
  openapi_dart: ^0.2.0
  openrpc_dart: ^0.2.0
  mcp_dart: ^1.0.2

dev_dependencies:
  build_runner: ^2.5.4
  json_serializable: 6.9.5
  lints: ^4.0.0
  test: ^1.24.0
  dotenv: ^4.2.0
