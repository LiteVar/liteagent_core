name: liteagent_core
description: LLM AI Agent sessions service in Dart.
version: 3.0.2
repository: https://github.com/LiteVar/liteagent_core

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  unique_id_dart: ^1.0.0
  json_annotation: ^4.12.0
  http: ^1.6.0
  token_pack: ^0.1.0
  front_matter_ml: ^1.2.0

  # OpenAI style api support
  dart_openai_sdk: ^6.2.0
  lite_oneapi: ^0.3.3

  # OpenSpec support
  opentool_dart: ^3.0.0
  opentool_daemon: ^0.5.3
  openapi_dart: ^0.2.0
  openrpc_dart: ^0.2.0
  mcp_dart: ^2.4.3

dev_dependencies:
  build_runner: ^2.17.1
  json_serializable: ^6.15.2
  lints: ^6.1.0
  test: ^1.33.0
  dotenv: ^4.2.0
